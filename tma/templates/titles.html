{% extends "base.html" %}
{% block content %}

  <!-- Green Header -->
  <header class="page-header">
    <h1>BOOK TITLES</h1>
  </header>

  <!-- Toolbar: Category dropdown, Search box, Count -->
  <section class="toolbar">
    <div class="count">
      <div>Number of titles: {{ total }}</div>
    </div>

    <form class="filter" method="get">
      <label for="category">Category</label>
      <select id="category" name="category">
        <option>All</option>
        <option>Children</option>
        <option>Teens</option>
        <option>Adult</option>
      </select>

      <button type="submit" class="btn btn-search">Search</button>
    </form>
  </section>

  <!-- Book Cards -->
  <section class="cards">
    {% for b in cards %}
      <article class="card">
        <img class="cover" src="{{ b.img }}" alt="{{ b.title }} cover">

        <div class="card-body">
          <h2 class="title">{{ b.title }}</h2>
          <div class="byline">By {{ b.authors }}</div>

          <div class="meta">
            Category: {{ b.category_line }}<br>
            Pages: {{ b.pages }}
          </div>

          <p class="desc">{{ b.short_desc | replace('\n', '<br><br>') | safe }}</p>

          <div class="actions">
            <a class="btn-details" href="#">More details</a>
          </div>
        </div>
      </article>
    {% endfor %}
  </section>

{% endblock %}
