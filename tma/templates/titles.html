{% extends "base.html" %}
{% block content %}

  <!-- Smaller green header -->
  <header class="page-header">
    <h1>BOOK TITLES</h1>
  </header>

  <!-- Category filter + total count -->
  <section class="toolbar">
    <div class="count">
      <div>Number of titles:</div>
      <div class="count-num">{{ total }}</div>
    </div>

    <form method="get" class="filter">
      <label for="category">Category</label>
      <select id="category" name="category">
        {% for c in categories %}
          <option value="{{ c }}" {{ 'selected' if c == selected else '' }}>{{ c }}</option>
        {% endfor %}
      </select>
      <button class="btn btn-search" type="submit">Search</button>
    </form>
  </section>

  <!-- Book Cards -->
  <section class="cards">
    {% for b in cards %}
      <article class="card">
        <img class="cover" src="{{ b.img }}" alt="{{ b.title }} cover">

        <div class="card-body">
          <h2 class="title">{{ b.title }}</h2>
          <div class="byline">By {{ b.authors }}</div>

          <div class="meta">
            Category: {{ b.category_line }}<br>
            Pages: {{ b.pages }}
          </div>

          <p class="desc">{{ b.short_desc | replace('\n', '<br><br>') | safe }}</p>

          <div class="actions">
            <a class="btn btn-details" href="#">More details</a>
          </div>
        </div>
      </article>
    {% endfor %}
  </section>

{% endblock %}
