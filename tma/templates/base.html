<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SG Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- make sure this path matches /static/style.css -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">SG Library</div>
    <nav class="nav">
      <a class="nav-link active" href="{{ url_for('titles_page') }}">📚 Book Titles</a>
    </nav>
    <div class="sidebar-photo" aria-hidden="true"></div>
  </aside>

  <!-- Main -->
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
