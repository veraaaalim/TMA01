{% extends "base.html" %}

{% block title %}Add a Book • SG Library{% endblock %}
{% block body_class %}add-book-page{% endblock %}

{% block content %}
  <header class="page-header">
    <h1>ADD A BOOK</h1>
  </header>

  <section class="form-container add-book">
    <div class="form-card form-wide">
      <!-- removed the inner "Add a Book" card title -->
      <form method="post" novalidate style="padding-top:16px">
        <div class="form-grid">

          <label for="genres">Choose multiple<br>Genres:</label>
          <select id="genres" name="genres" multiple size="10">
            {% for g in genres %}
              <option value="{{ g }}">{{ g }}</option>
            {% endfor %}
          </select>

          <label for="title">Title:</label>
          <input id="title" name="title" type="text" placeholder="Book title" required>

          <label for="category">Choose a category:</label>
          <select id="category" name="category" required>
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>

          <label for="url">URL for Cover:</label>
          <input id="url" name="url" type="url" placeholder="https://...">

          <label class="full" for="description">Description:</label>
          <textarea id="description" name="description" class="full" placeholder="One paragraph per line"></textarea>

          <!-- Authors 1..5 -->
          {% for i in range(1,6) %}
          <label for="author{{ i }}" class="lb">Author {{ i }}:</label>
          <div class="fld fld-author">
            <input id="author{{ i }}" name="author{{ i }}" type="text">
            <label class="chk-illus">
              <input type="checkbox" name="illus{{ i }}"> <span>Illustrator</span>
            </label>
          </div>
        {% endfor %}
        

          <label for="pages">Number of pages:</label>
          <input id="pages" name="pages" type="number" min="0" step="1" placeholder="e.g. 320">

          <label for="copies">Number of copies:</label>
          <input id="copies" name="copies" type="number" min="1" step="1" placeholder="e.g. 3">

          <div class="full form-actions">
            <button type="button" class="btn-secondary" onclick="history.back()">Cancel</button>
            <button type="submit" class="btn-submit">Submit</button>
          </div>

        </div>
      </form>
    </div>
  </section>
{% endblock %}
